# Used only when you start with the "mysql" profile:
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# (or set the active profile to "mysql" in your VS Code run settings)
spring.datasource.url=jdbc:mysql://localhost:3306/estudy?createDatabaseIfNotExist=true&serverTimezone=Asia/Manila
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
