spring.application.name=Estudy
server.port=8080


# ---- Database: H2 file database (no install needed). Saved in backend/data/ ----
spring.datasource.url=jdbc:h2:file:./data/estudy
spring.datasource.username=sa
spring.datasource.password=
spring.profiles.active=mysql

# H2 browser console is OFF: it clashes with the security URL rules. Use a DB tool (e.g. the VS Code
# "SQLTools" or DBeaver) on the file above, or the MySQL profile.
spring.h2.console.enabled=false

# Creates/updates the tables from the @Entity classes automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Which website addresses may call this API (the React dev server)
app.cors.allowed-origins=http://localhost:5173

# ---- Login tokens (JWT) ----
# Base64 secret, at least 32 bytes. This one is for local development only.
# Set the JWT_SECRET environment variable to use your own (required for any real deployment).
app.jwt.secret=${JWT_SECRET:O5DGspdBou9H9aLhLBemBbDPtzIvJuvcOvOUSpTJ0klpOiQOAVmQd85BS1Y4F+Li}
app.jwt.expiration-minutes=60
app.jwt.remember-me-days=7

# ---- First admin, created at startup only if no admin exists yet. CHANGE THE PASSWORD before deploying. ----
app.seed-admin.enabled=true
app.seed-admin.email=admin@estudy.local
app.seed-admin.username=ADMIN-001
app.seed-admin.password=Admin12345

# Stops Spring Boot from printing a random "default user password" (we have our own login).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
